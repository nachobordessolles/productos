<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras</title>
<style>
  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --card:     #22263a;
    --border:   #2e3250;
    --accent:   #4f8ef7;
    --accent2:  #38d9a9;
    --danger:   #f06b6b;
    --text:     #e8eaf0;
    --muted:    #7a82a0;
    --cat-pill: #2a2f4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .9rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--text);
  }
  header h1 span { color: var(--accent); }

  .badge-lista {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    font-size: .7rem;
    font-weight: 700;
    padding: .15rem .5rem;
    margin-left: .4rem;
    display: none;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1rem;
  }
  .tab {
    padding: .7rem 1.2rem;
    cursor: pointer;
    font-size: .88rem;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    user-select: none;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }

  /* ── MAIN ── */
  main { padding: 1rem; max-width: 640px; margin: 0 auto; }

  /* ── STATUS BAR ── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  .status-dot.ok  { background: var(--accent2); }
  .status-dot.err { background: var(--danger); }
  .status-text { font-size: .78rem; color: var(--muted); }

  /* ── SECCIÓN CATEGORÍA ── */
  .cat-section { margin-bottom: 1.4rem; }
  .cat-header {
    display: flex;
    align-items: center;
    gap: .5rem;
    margin-bottom: .5rem;
  }
  .cat-label {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    background: var(--cat-pill);
    border-radius: 4px;
    padding: .2rem .55rem;
  }
  .cat-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── PRODUCTO ROW ── */
  .prod-row {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .55rem .7rem;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    margin-bottom: .35rem;
    transition: background .15s;
    cursor: pointer;
  }
  .prod-row:hover { background: #272b40; }
  .prod-row.en-lista { border-color: var(--accent); background: #1a2038; }
  .prod-row.comprado { opacity: .45; }
  .prod-row.comprado .prod-nombre { text-decoration: line-through; color: var(--muted); }

  .prod-check {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
    font-size: .75rem;
  }
  .prod-row.en-lista .prod-check { border-color: var(--accent); background: var(--accent); color: #fff; }
  .prod-row.comprado .prod-check { border-color: var(--accent2); background: var(--accent2); color: #fff; }

  .prod-nombre { flex: 1; font-size: .92rem; }

  /* ── CANTIDAD ── */
  .qty-control {
    display: flex;
    align-items: center;
    gap: .3rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  .prod-row.en-lista .qty-control,
  .prod-row.comprado .qty-control { opacity: 1; pointer-events: auto; }

  .qty-btn {
    width: 24px; height: 24px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .qty-btn:hover { background: var(--accent); border-color: var(--accent); }
  .qty-num {
    font-size: .85rem;
    font-weight: 700;
    min-width: 18px;
    text-align: center;
  }

  /* ── BOTONES ── */
  .btn {
    border: none;
    border-radius: 8px;
    padding: .6rem 1.1rem;
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: var(--accent2); color: #0f1117; }
  .btn-danger  { background: var(--danger);  color: #fff; }
  .btn-ghost   { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .action-bar {
    display: flex;
    gap: .6rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  /* ── MODO COMPRAR: resumen ── */
  .comprar-header {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .8rem 1rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .comprar-progress {
    font-size: .85rem;
    color: var(--muted);
  }
  .comprar-progress strong { color: var(--accent2); font-size: 1.1rem; }
  .progress-bar-wrap {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    margin-top: .5rem;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 99px;
    transition: width .3s;
  }

  /* ── MODAL NUEVO PRODUCTO ── */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem;
    width: 100%;
    max-width: 380px;
  }
  .modal h2 { font-size: 1rem; margin-bottom: 1rem; }
  .field { margin-bottom: .8rem; }
  .field label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .3rem; }
  .field input, .field select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: .55rem .7rem;
    font-size: .92rem;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .modal-actions { display: flex; gap: .6rem; justify-content: flex-end; margin-top: 1rem; }

  /* ── EDITAR NOMBRE INLINE ── */
  .btn-edit {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: .82rem;
    padding: .2rem .3rem;
    border-radius: 4px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity .15s, color .15s;
  }
  .prod-row:hover .btn-edit { opacity: 1; }
  .btn-edit:hover { color: var(--accent); }

  .prod-nombre-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 5px;
    color: var(--text);
    font-size: .92rem;
    padding: .15rem .4rem;
    outline: none;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 1.5rem; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: .6rem 1.2rem;
    font-size: .85rem;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 300;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }
  .empty .icon { font-size: 2.5rem; margin-bottom: .6rem; }
  .empty p { font-size: .9rem; }

  /* ── SAVING ── */
  .saving-indicator {
    font-size: .72rem;
    color: var(--muted);
    display: none;
  }
  .saving-indicator.visible { display: inline; }
</style>
</head>
<body>

<header>
  <h1>🛒 <span>Lista</span> de Compras <span class="badge-lista" id="badgeLista">0</span></h1>
  <span class="saving-indicator" id="savingInd">guardando…</span>
</header>

<div class="tabs">
  <div class="tab active" id="tabPlanificar" onclick="setTab('planificar')">📋 Planificar</div>
  <div class="tab" id="tabComprar" onclick="setTab('comprar')">✅ Comprar</div>
</div>

<main>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Cargando…</span>
  </div>

  <!-- ══ TAB PLANIFICAR ══ -->
  <div id="panelPlanificar">
    <div class="action-bar">
      <button class="btn btn-primary" onclick="abrirModalNuevo()">+ Nuevo producto</button>
      <button class="btn btn-ghost" onclick="guardar()">💾 Guardar lista</button>
    </div>
    <div id="catalogoContainer"></div>
  </div>

  <!-- ══ TAB COMPRAR ══ -->
  <div id="panelComprar" style="display:none">
    <div class="comprar-header">
      <div>
        <div class="comprar-progress">
          <strong id="cmpCount">0</strong> / <span id="cmpTotal">0</span> productos comprados
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
        </div>
      </div>
      <button class="btn btn-danger" onclick="limpiarLista()">🗑 Limpiar lista</button>
    </div>
    <div id="comprarContainer"></div>
  </div>
</main>

<!-- ══ MODAL NUEVO PRODUCTO ══ -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>➕ Nuevo producto</h2>
    <div class="field">
      <label>Nombre</label>
      <input type="text" id="inputNombre" placeholder="Ej: Fideos moñito">
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="inputCategoria">
        <option value="Limpieza">Limpieza</option>
        <option value="Almacén">Almacén</option>
        <option value="Heladera">Heladera</option>
        <option value="Otro">Otro</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarNuevoProducto()">Agregar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ CONFIG ══
const SCRIPT_URL   = 'https://script.google.com/macros/s/AKfycbznkUrD6e4xVjsYJ6UvFUTwVh0lu6nemBVVqt3ve02aHHW-W3Xg-qpU6MSDWeMYo6BO/exec';
const CSV_PRODUCTOS= 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_P4cU1iORXTyxBG09jo7v9Kyuk4gHFwog6XqTefRwyx09_TYtGZKw7XbxgLNZ0MrmpoFxd_2tLi1w/pub?gid=0&single=true&output=csv';
const CSV_ESTADO   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_P4cU1iORXTyxBG09jo7v9Kyuk4gHFwog6XqTefRwyx09_TYtGZKw7XbxgLNZ0MrmpoFxd_2tLi1w/pub?gid=1847026016&single=true&output=csv';

// ══ ESTADO ══
let catalogo  = []; // [{nombre, categoria, cantidad_default}]
let lista     = {}; // {nombre: {qty, comprado}}  — los que están en la lista activa
let tabActual = 'planificar';
let saveTimer = null;

// ══ INIT ══
async function init(){
  setStatus('cargando');
  try {
    await Promise.all([cargarCatalogo(), cargarEstado()]);
    setStatus('ok');
  } catch(e){
    setStatus('err', 'Sin conexión — usando datos locales');
    cargarLocal();
  }
  render();
}

// ══ CARGA CATÁLOGO ══
async function cargarCatalogo(){
  const res  = await fetch(CSV_PRODUCTOS + '&t=' + Date.now());
  const text = await res.text();
  const filas = text.trim().split('\n').slice(1); // salteamos header
  catalogo = filas.map(f => {
    const cols = f.split(',');
    return {
      nombre:    cols[0]?.trim().replace(/^"|"$/g,'') || '',
      categoria: cols[1]?.trim().replace(/^"|"$/g,'') || 'Otro',
      qty_default: parseInt(cols[2]) || 1
    };
  }).filter(p => p.nombre);
}

// ══ CARGA ESTADO ══
async function cargarEstado(){
  const res  = await fetch(CSV_ESTADO + '&t=' + Date.now());
  const text = await res.text();
  const filas = text.trim().split('\n');
  // B1: segunda columna de la primera fila
  const raw = filas[0].substring(filas[0].indexOf(',') + 1).trim().replace(/^"|"$/g,'');
  const data = raw && raw !== '{}' ? JSON.parse(raw) : {};
  lista = data.lista || {};
}

function cargarLocal(){
  try {
    const raw = localStorage.getItem('lista_compras');
    if(raw) lista = JSON.parse(raw);
  } catch(e){}
}

// ══ GUARDAR ══
function guardarDebounce(){
  clearTimeout(saveTimer);
  document.getElementById('savingInd').classList.add('visible');
  saveTimer = setTimeout(guardar, 1200);
}

async function guardar(){
  clearTimeout(saveTimer);
  const payload = { lista };
  localStorage.setItem('lista_compras', JSON.stringify(lista));
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    showToast('Lista guardada ✓');
  } catch(e){
    showToast('Guardado solo localmente');
  }
  document.getElementById('savingInd').classList.remove('visible');
}

// ══ TOGGLE EN LISTA (tab planificar) ══
function toggleEnLista(nombre){
  if(lista[nombre]){
    delete lista[nombre];
  } else {
    const prod = catalogo.find(p => p.nombre === nombre);
    lista[nombre] = { qty: prod?.qty_default || 1, comprado: false };
  }
  guardarDebounce();
  render();
}

// ══ CAMBIAR CANTIDAD ══
function cambiarQty(nombre, delta, e){
  e.stopPropagation();
  if(!lista[nombre]) return;
  lista[nombre].qty = Math.max(1, (lista[nombre].qty || 1) + delta);
  guardarDebounce();
  render();
}

// ══ TOGGLE COMPRADO (tab comprar) ══
function toggleComprado(nombre, e){
  e.stopPropagation();
  if(!lista[nombre]) return;
  lista[nombre].comprado = !lista[nombre].comprado;
  guardarDebounce();
  renderComprar();
  actualizarBadge();
}

// ══ LIMPIAR LISTA ══
function limpiarLista(){
  if(!confirm('¿Limpiar toda la lista?')) return;
  lista = {};
  guardar();
  render();
}

// ══ RENDER PRINCIPAL ══
function render(){
  renderCatalogo();
  renderComprar();
  actualizarBadge();
}

// ══ RENDER CATÁLOGO ══
function renderCatalogo(){
  const cont = document.getElementById('catalogoContainer');
  if(!catalogo.length){
    cont.innerHTML = '<div class="empty"><div class="icon">📦</div><p>Cargando catálogo…</p></div>';
    return;
  }

  // Agrupar por categoría y ordenar alfabéticamente
  const cats = {};
  catalogo.forEach(p => {
    if(!cats[p.categoria]) cats[p.categoria] = [];
    cats[p.categoria].push(p);
  });
  Object.values(cats).forEach(arr => arr.sort((a,b) => a.nombre.localeCompare(b.nombre, 'es')));

  let html = '';
  for(const [cat, prods] of Object.entries(cats)){
    html += `<div class="cat-section">
      <div class="cat-header">
        <span class="cat-label">${cat}</span>
        <div class="cat-line"></div>
      </div>`;
    prods.forEach(p => {
      const enLista = !!lista[p.nombre];
      const qty     = lista[p.nombre]?.qty || 1;
      html += `
        <div class="prod-row ${enLista ? 'en-lista' : ''}" onclick="toggleEnLista('${esc(p.nombre)}')">
          <div class="prod-check">${enLista ? '✓' : ''}</div>
          <span class="prod-nombre">${p.nombre}</span>
          <button class="btn-edit" onclick="editarNombre('${esc(p.nombre)}', event)" title="Editar nombre">✏️</button>
          <div class="qty-control" onclick="event.stopPropagation()">
            <button class="qty-btn" onclick="cambiarQty('${esc(p.nombre)}',-1,event)">−</button>
            <span class="qty-num">${qty}</span>
            <button class="qty-btn" onclick="cambiarQty('${esc(p.nombre)}',1,event)">+</button>
          </div>
        </div>`;
    });
    html += '</div>';
  }
  cont.innerHTML = html;
}

// ══ RENDER COMPRAR ══
function renderComprar(){
  const cont = document.getElementById('comprarContainer');
  const items = Object.entries(lista);

  if(!items.length){
    cont.innerHTML = '<div class="empty"><div class="icon">🛒</div><p>La lista está vacía.<br>Agregá productos en la pestaña Planificar.</p></div>';
    actualizarProgreso(0, 0);
    return;
  }

  // Agrupar por categoría
  const cats = {};
  items.forEach(([nombre, data]) => {
    const prod = catalogo.find(p => p.nombre === nombre);
    const cat  = prod?.categoria || 'Otro';
    if(!cats[cat]) cats[cat] = [];
    cats[cat].push({ nombre, ...data });
  });

  let html = '';
  let total = 0, comprados = 0;

  for(const [cat, prods] of Object.entries(cats)){
    html += `<div class="cat-section">
      <div class="cat-header">
        <span class="cat-label">${cat}</span>
        <div class="cat-line"></div>
      </div>`;
    prods.forEach(p => {
      total++;
      if(p.comprado) comprados++;
      html += `
        <div class="prod-row ${p.comprado ? 'comprado' : ''}" onclick="toggleComprado('${esc(p.nombre)}',event)">
          <div class="prod-check">${p.comprado ? '✓' : ''}</div>
          <span class="prod-nombre">${p.nombre}</span>
          <div class="qty-control" onclick="event.stopPropagation()">
            <button class="qty-btn" onclick="cambiarQty('${esc(p.nombre)}',-1,event)">−</button>
            <span class="qty-num">${p.qty || 1}</span>
            <button class="qty-btn" onclick="cambiarQty('${esc(p.nombre)}',1,event)">+</button>
          </div>
        </div>`;
    });
    html += '</div>';
  }

  cont.innerHTML = html;
  actualizarProgreso(comprados, total);
}

function actualizarProgreso(c, t){
  document.getElementById('cmpCount').textContent = c;
  document.getElementById('cmpTotal').textContent  = t;
  document.getElementById('progressFill').style.width = t ? (c/t*100)+'%' : '0%';
}

function actualizarBadge(){
  const n = Object.keys(lista).length;
  const badge = document.getElementById('badgeLista');
  badge.textContent = n;
  badge.style.display = n ? 'inline' : 'none';
}

// ══ MODAL NUEVO PRODUCTO ══
function abrirModalNuevo(){
  // Poblar categorías dinámicas
  const cats = [...new Set(catalogo.map(p => p.categoria)), 'Otro'];
  const sel = document.getElementById('inputCategoria');
  sel.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('inputNombre').value = '';
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('inputNombre').focus();
}

function cerrarModal(){
  document.getElementById('modalBg').classList.remove('open');
}

async function guardarNuevoProducto(){
  const nombre = document.getElementById('inputNombre').value.trim();
  const cat    = document.getElementById('inputCategoria').value;
  if(!nombre){ showToast('Escribí un nombre'); return; }
  if(catalogo.find(p => p.nombre.toLowerCase() === nombre.toLowerCase())){
    showToast('Ya existe ese producto'); return;
  }
  catalogo.push({ nombre, categoria: cat, qty_default: 1 });
  cerrarModal();
  showToast(`"${nombre}" agregado al catálogo`);
  // Nota: el nuevo producto queda en la app. Para persistirlo en el sheet
  // habría que agregar una función de escritura a la hoja Productos.
  render();
}

// ══ EDITAR NOMBRE INLINE ══
function editarNombre(nombreActual, e){
  e.stopPropagation();
  // Buscar el span del nombre dentro de la misma fila
  const row = e.target.closest('.prod-row');
  const span = row.querySelector('.prod-nombre');
  if(!span) return;

  // Reemplazar span por input
  const input = document.createElement('input');
  input.className = 'prod-nombre-input';
  input.value = nombreActual;
  span.replaceWith(input);
  input.focus();
  input.select();

  // Deshabilitar el click de la fila mientras se edita
  row.onclick = null;

  const confirmar = () => {
    const nuevoNombre = input.value.trim();
    if(nuevoNombre && nuevoNombre !== nombreActual){
      // Actualizar en catálogo
      const prod = catalogo.find(p => p.nombre === nombreActual);
      if(prod){
        // Si estaba en la lista, migrar la key
        if(lista[nombreActual]){
          lista[nuevoNombre] = lista[nombreActual];
          delete lista[nombreActual];
        }
        prod.nombre = nuevoNombre;
        guardarDebounce();
        showToast(`Renombrado a "${nuevoNombre}"`);
      }
    }
    render();
  };

  input.addEventListener('blur', confirmar);
  input.addEventListener('keydown', ev => {
    if(ev.key === 'Enter')  { input.blur(); }
    if(ev.key === 'Escape') { input.value = nombreActual; input.blur(); }
  });
}

// ══ TABS ══
function setTab(tab){
  tabActual = tab;
  document.getElementById('panelPlanificar').style.display = tab === 'planificar' ? '' : 'none';
  document.getElementById('panelComprar').style.display    = tab === 'comprar'    ? '' : 'none';
  document.getElementById('tabPlanificar').classList.toggle('active', tab === 'planificar');
  document.getElementById('tabComprar').classList.toggle('active',    tab === 'comprar');
  if(tab === 'comprar') renderComprar();
}

// ══ STATUS ══
function setStatus(state, msg){
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className = 'status-dot ' + (state === 'ok' ? 'ok' : state === 'err' ? 'err' : '');
  text.textContent = msg || (state === 'ok' ? 'Conectado' : state === 'err' ? 'Sin conexión' : 'Cargando…');
}

// ══ TOAST ══
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ══ HELPER ══
function esc(s){ return s.replace(/'/g, "\\'"); }

// ══ TECLAS ══
document.getElementById('modalBg').addEventListener('keydown', e => {
  if(e.key === 'Escape') cerrarModal();
  if(e.key === 'Enter')  guardarNuevoProducto();
});

// ══ ARRANCAR ══
init();
</script>
