<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f8ef7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg:#0f1117; --surface:#1a1d27; --card:#22263a; --border:#2e3250;
    --accent:#4f8ef7; --accent2:#38d9a9; --danger:#f06b6b; --warn:#f59e0b;
    --verde:#4ade80; --text:#e8eaf0; --muted:#7a82a0; --cat-pill:#2a2f4a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;min-height:100vh;}

  /* HEADER */
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  header h1{font-size:1.1rem;font-weight:700;}
  header h1 span{color:var(--accent);}
  .badge-lista{background:var(--accent);color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:.15rem .5rem;margin-left:.4rem;display:none;}
  .saving-indicator{font-size:.72rem;color:var(--muted);display:none;}
  .saving-indicator.visible{display:inline;}

  /* MODO SELECTOR */
  .modo-selector{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1rem;display:flex;gap:.5rem;}
  .modo-btn{flex:1;padding:.55rem;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--muted);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;}
  .modo-btn.active-super{border-color:var(--accent);background:#1a2038;color:var(--accent);}
  .modo-btn.active-verde{border-color:var(--verde);background:#1a2f1a;color:var(--verde);}

  /* TABS */
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 1rem;}
  .tab{padding:.7rem 1.2rem;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;user-select:none;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab.active-verde{color:var(--verde);border-bottom-color:var(--verde);}
  .tab:hover:not(.active):not(.active-verde){color:var(--text);}

  main{padding:1rem;max-width:640px;margin:0 auto;}

  /* STATUS */
  .status-bar{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .3s;}
  .status-dot.ok{background:var(--accent2);} .status-dot.err{background:var(--danger);}
  .status-text{font-size:.78rem;color:var(--muted);}
  .offline-banner{background:#2a1a0a;border:1px solid var(--warn);border-radius:8px;padding:.5rem .8rem;font-size:.8rem;color:var(--warn);margin-bottom:.8rem;display:none;}
  .offline-banner.visible{display:block;}

  /* BUSCADOR */
  .search-wrap{position:relative;margin-bottom:1rem;}
  .search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.55rem .7rem .55rem 2.2rem;font-size:.92rem;transition:border-color .15s;}
  .search-wrap input:focus{outline:none;border-color:var(--accent);}
  .search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  .search-clear{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:.85rem;display:none;}
  .search-clear.visible{display:block;}

  /* FILTROS */
  .filtros-bar{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap;}
  .filtro-btn{background:var(--card);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:.78rem;font-weight:600;padding:.25rem .75rem;cursor:pointer;transition:all .15s;}
  .filtro-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .filtro-btn.active-verde{background:var(--verde);border-color:var(--verde);color:#0f1117;}
  .filtro-btn:hover:not(.active):not(.active-verde){border-color:var(--accent);color:var(--accent);}

  /* CATEGORÍA */
  .cat-section{margin-bottom:1.4rem;}
  .cat-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;}
  .cat-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--cat-pill);border-radius:4px;padding:.2rem .55rem;cursor:pointer;transition:background .15s,color .15s;}
  .cat-label:hover{background:var(--accent);color:#fff;}
  .cat-label-input{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--surface);border:1px solid var(--accent);border-radius:4px;color:var(--text);padding:.15rem .45rem;outline:none;width:120px;}
  .cat-line{flex:1;height:1px;background:var(--border);}

  /* PRODUCTO ROW */
  .prod-wrap{margin-bottom:.35rem;}
  .prod-row{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:8px;background:var(--card);border:1px solid var(--border);transition:background .15s;cursor:pointer;}
  .prod-wrap.expanded .prod-row{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent;}
  .prod-row:hover{background:#272b40;}
  .prod-row.en-lista{border-color:var(--accent);background:#1a2038;}
  .prod-row.en-lista-verde{border-color:var(--verde);background:#1a2f1a;}
  .prod-row.comprado{opacity:.45;}
  .prod-row.comprado .prod-nombre{text-decoration:line-through;color:var(--muted);}
  .prod-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;font-size:.75rem;}
  .prod-row.en-lista .prod-check{border-color:var(--accent);background:var(--accent);color:#fff;}
  .prod-row.en-lista-verde .prod-check{border-color:var(--verde);background:var(--verde);color:#0f1117;}
  .prod-row.comprado .prod-check{border-color:var(--accent2);background:var(--accent2);color:#fff;}
  .prod-info{flex:1;min-width:0;}
  .prod-nombre{font-size:.92rem;display:block;}
  .prod-meta{display:flex;gap:.5rem;align-items:center;margin-top:.15rem;flex-wrap:wrap;}
  .prod-nota-preview{font-size:.73rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
  .prod-precio-preview{font-size:.73rem;color:var(--accent2);font-weight:600;}
  .freq-badge{font-size:.65rem;font-weight:700;padding:.1rem .35rem;border-radius:3px;}
  .freq-fijo{background:#1e3a2f;color:var(--accent2);}
  .freq-ocasional{background:#2a2030;color:#a78bfa;}
  .unidad-badge{font-size:.65rem;font-weight:700;padding:.1rem .35rem;border-radius:3px;background:#1e2a3a;color:var(--accent);}

  /* PANEL DETALLE */
  .prod-detalle{background:#1a1d27;border:1px solid var(--accent);border-top:none;border-bottom-left-radius:8px;border-bottom-right-radius:8px;padding:.65rem .75rem;display:none;}
  .prod-wrap.expanded .prod-detalle{display:block;}
  .detalle-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem;}
  .detalle-field label{display:block;font-size:.7rem;color:var(--muted);margin-bottom:.2rem;}
  .detalle-field input,.detalle-field select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.4rem .55rem;font-size:.85rem;}
  .detalle-field input:focus,.detalle-field select:focus{outline:none;border-color:var(--accent);}
  .detalle-nota label{display:block;font-size:.7rem;color:var(--muted);margin-bottom:.2rem;}
  .detalle-nota input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.4rem .55rem;font-size:.85rem;}
  .detalle-nota input:focus{outline:none;border-color:var(--accent);}

  /* ACCIONES */
  .prod-actions{display:flex;gap:.25rem;opacity:0;transition:opacity .15s;flex-shrink:0;}
  .prod-row:hover .prod-actions{opacity:1;}
  .btn-icon{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.82rem;padding:.2rem .3rem;border-radius:4px;transition:color .15s,background .15s;line-height:1;}
  .btn-icon:hover{color:var(--text);background:var(--border);}
  .btn-icon.del:hover{color:var(--danger);}

  /* CANTIDAD */
  .qty-control{display:flex;align-items:center;gap:.3rem;opacity:0;pointer-events:none;transition:opacity .15s;}
  .prod-row.en-lista .qty-control,.prod-row.en-lista-verde .qty-control,.prod-row.comprado .qty-control{opacity:1;pointer-events:auto;}
  .qty-btn{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .qty-btn:hover{background:var(--accent);border-color:var(--accent);}
  .qty-num{font-size:.85rem;font-weight:700;min-width:18px;text-align:center;}
  .qty-unit{font-size:.72rem;color:var(--muted);}
  .prod-nombre-input{background:var(--surface);border:1px solid var(--accent);border-radius:5px;color:var(--text);font-size:.92rem;padding:.15rem .4rem;outline:none;width:100%;}

  /* THUMBNAIL */
  .prod-thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);}
  .prod-thumb-placeholder{width:38px;height:38px;border-radius:6px;flex-shrink:0;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted);}
  .foto-preview{width:100%;max-height:120px;object-fit:cover;border-radius:6px;margin-top:.4rem;border:1px solid var(--border);}
  .foto-preview.error{display:none;}

  /* TOTAL */
  .total-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem;}
  .total-label{font-size:.8rem;color:var(--muted);}
  .total-monto{font-size:1.3rem;font-weight:700;color:var(--accent2);}
  .total-monto.parcial{color:var(--warn);}
  .total-detalle{font-size:.72rem;color:var(--muted);}

  /* BOTONES */
  .btn{border:none;border-radius:8px;padding:.6rem 1.1rem;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary-verde{background:var(--verde);color:#0f1117;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .action-bar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap;}

  /* COMPRAR HEADER */
  .comprar-header{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
  .comprar-progress{font-size:.85rem;color:var(--muted);}
  .comprar-progress strong{color:var(--accent2);font-size:1.1rem;}
  .progress-bar-wrap{width:100%;height:4px;background:var(--border);border-radius:99px;margin-top:.5rem;}
  .progress-bar-fill{height:100%;background:var(--accent2);border-radius:99px;transition:width .3s;}

  /* HISTORIAL */
  .hist-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:border-color .15s;}
  .hist-item:hover{border-color:var(--accent);}
  .hist-item.verde{border-left:3px solid var(--verde);}
  .hist-item.super{border-left:3px solid var(--accent);}
  .hist-header{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;}
  .hist-fecha{font-size:.8rem;color:var(--muted);}
  .hist-total{font-size:.85rem;color:var(--accent2);font-weight:700;}
  .hist-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem;}
  .hist-tag{font-size:.68rem;background:var(--cat-pill);color:var(--muted);border-radius:3px;padding:.1rem .4rem;}
  .hist-modo-badge{font-size:.68rem;font-weight:700;padding:.1rem .4rem;border-radius:3px;margin-right:.3rem;}
  .hist-modo-super{background:#1a2038;color:var(--accent);}
  .hist-modo-verde{background:#1a2f1a;color:var(--verde);}
  .hist-detalle{margin-top:.6rem;display:none;border-top:1px solid var(--border);padding-top:.6rem;}
  .hist-item.abierto .hist-detalle{display:block;}
  .hist-prod-row{display:flex;justify-content:space-between;font-size:.8rem;padding:.2rem 0;border-bottom:1px solid #2e325050;}
  .hist-prod-row:last-child{border-bottom:none;}
  .hist-acciones{display:flex;gap:.4rem;margin-top:.6rem;}

  /* VERDULERÍA QTY */
  .verd-qty{display:flex;align-items:center;gap:.3rem;}
  .verd-qty input{width:55px;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:.85rem;padding:.2rem .4rem;text-align:center;}
  .verd-qty input:focus{outline:none;border-color:var(--verde);}
  .verd-qty select{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:.78rem;padding:.2rem .3rem;}
  .verd-qty select:focus{outline:none;border-color:var(--verde);}

  /* MODAL */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:1rem;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;}
  .modal h2{font-size:1rem;margin-bottom:1rem;}
  .field{margin-bottom:.8rem;}
  .field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.3rem;}
  .field input,.field select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:.55rem .7rem;font-size:.92rem;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
  .modal-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;}
  .new-cat-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.8rem;}
  .new-cat-row input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:.45rem .6rem;font-size:.85rem;}
  .new-cat-row input:focus{outline:none;border-color:var(--accent2);}
  .new-cat-row .btn-icon{color:var(--accent2);font-size:1rem;border:1px solid var(--border);padding:.3rem .5rem;border-radius:6px;}

  .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.6rem 1.2rem;font-size:.85rem;opacity:0;transition:opacity .25s,transform .25s;z-index:300;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .empty{text-align:center;padding:3rem 1rem;color:var(--muted);}
  .empty .icon{font-size:2.5rem;margin-bottom:.6rem;}
  .empty p{font-size:.9rem;}
  mark{background:#4f8ef740;color:var(--text);border-radius:2px;}

  /* STATS */
  .stats-section{margin-bottom:1.6rem;}
  .stats-title{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:.5rem;}
  .stat-bar-wrap{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem;}
  .stat-bar-label{font-size:.82rem;min-width:140px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat-bar-outer{flex:1;height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
  .stat-bar-inner{height:100%;border-radius:99px;transition:width .4s;}
  .stat-bar-val{font-size:.78rem;color:var(--muted);min-width:30px;text-align:right;flex-shrink:0;}
  .stat-big{font-size:1.6rem;font-weight:700;color:var(--accent2);}
  .stat-sub{font-size:.78rem;color:var(--muted);margin-top:.2rem;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem;}
  .stat-mini{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;}
  .stat-mini-val{font-size:1.1rem;font-weight:700;color:var(--accent);}
  .stat-mini-label{font-size:.72rem;color:var(--muted);margin-top:.1rem;}
  .inflacion-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border-radius:6px;font-size:.85rem;font-weight:700;margin-top:.4rem;}
  .inflacion-badge.sube{background:#3a1a1a;color:var(--danger);}
  .inflacion-badge.baja{background:#1a3a1a;color:var(--verde);}

  /* COMPARADOR DE PRECIOS */
  .precio-comp{margin-top:.8rem;border-top:1px solid var(--border);padding-top:.7rem;}
  .precio-comp-title{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem;}
  .precio-comp-row{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;padding:.25rem 0;border-bottom:1px solid #2e325030;}
  .precio-comp-row:last-child{border-bottom:none;}
  .precio-comp-nombre{flex:1;color:var(--text);}
  .precio-comp-valores{display:flex;align-items:center;gap:.5rem;flex-shrink:0;}
  .precio-ant{color:var(--muted);font-size:.75rem;text-decoration:line-through;}
  .precio-nuevo{font-weight:600;}
  .badge-sube{background:#3a1a1a;color:var(--danger);font-size:.68rem;font-weight:700;padding:.1rem .35rem;border-radius:3px;}
  .badge-baja{background:#1a3a1a;color:var(--verde);font-size:.68rem;font-weight:700;padding:.1rem .35rem;border-radius:3px;}
  .badge-igual{background:var(--cat-pill);color:var(--muted);font-size:.68rem;font-weight:700;padding:.1rem .35rem;border-radius:3px;}
  .resumen-inflacion{margin-top:.6rem;padding:.5rem .7rem;border-radius:7px;font-size:.8rem;display:flex;justify-content:space-between;align-items:center;}
  .resumen-inflacion.sube{background:#3a1a1a;border:1px solid var(--danger);}
  .resumen-inflacion.baja{background:#1a3a1a;border:1px solid var(--verde);}

  /* ── TAREAS ── */
  .modo-btn.active-tareas{border-color:var(--warn);background:#2f2610;color:var(--warn);}
  .t-quien{display:flex;gap:.5rem;align-items:center;margin-bottom:.7rem;font-size:.8rem;color:var(--muted);flex-wrap:wrap;}
  .t-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:.3rem .8rem;font-size:.8rem;color:var(--text);cursor:pointer;white-space:nowrap;}
  .t-chip.on{background:var(--warn);border-color:var(--warn);color:#0f1117;font-weight:600;}
  .t-chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.5rem;}
  .t-add{display:flex;gap:.5rem;margin-bottom:.8rem;}
  .t-add input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.6rem .8rem;font-size:.95rem;}
  .t-add input:focus{outline:none;border-color:var(--warn);}
  .t-add-extra{display:flex;gap:.5rem;margin:-.4rem 0 .8rem;}
  .t-add-extra input{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.5rem .7rem;font-size:.85rem;min-width:0;}
  .t-add-extra input:focus{outline:none;border-color:var(--warn);}
  .t-add-extra #tNuevaDesc{flex:1;}
  .t-add-extra #tNuevaFecha{flex:0 0 auto;width:9.5rem;color-scheme:dark;}
  .t-item{display:flex;gap:.7rem;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem .8rem;margin-bottom:.5rem;}
  .t-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#0f1117;margin-top:2px;}
  .t-item.done .t-check{background:var(--verde);border-color:var(--verde);}
  .t-body{flex:1;min-width:0;}
  .t-titulo{font-size:.95rem;word-break:break-word;}
  .t-item.done .t-titulo{text-decoration:line-through;color:var(--muted);}
  .t-desc{font-size:.8rem;color:var(--muted);margin-top:.15rem;word-break:break-word;}
  .t-meta{display:flex;gap:.6rem;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:.3rem;}

<script>
const SCRIPT_URL     = 'https://script.google.com/macros/s/AKfycbwg44TWi_amEWA-ezc1DST14WFZ5j6jMSJ2_F2qP3crwFj_58phzNgr7KpU0FgTr6yv/exec';
const CSV_PRODUCTOS  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_P4cU1iORXTyxBG09jo7v9Kyuk4gHFwog6XqTefRwyx09_TYtGZKw7XbxgLNZ0MrmpoFxd_2tLi1w/pub?gid=0&single=true&output=csv';
const CSV_VERDULERIA = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_P4cU1iORXTyxBG09jo7v9Kyuk4gHFwog6XqTefRwyx09_TYtGZKw7XbxgLNZ0MrmpoFxd_2tLi1w/pub?gid=1009068369&single=true&output=csv';
const CSV_ESTADO     = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_P4cU1iORXTyxBG09jo7v9Kyuk4gHFwog6XqTefRwyx09_TYtGZKw7XbxgLNZ0MrmpoFxd_2tLi1w/pub?gid=1847026016&single=true&output=csv';
const CSV_HISTORIAL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_P4cU1iORXTyxBG09jo7v9Kyuk4gHFwog6XqTefRwyx09_TYtGZKw7XbxgLNZ0MrmpoFxd_2tLi1w/pub?gid=1967145067&single=true&output=csv';

// ESTADO GLOBAL
let catalogoSuper=[], catalogoVerde=[];
let listaSuper={}, listaVerde={};
let historialSuper=[], historialVerde=[];
let busqueda='', filtroActivo='todos';
let modo='super'; // 'super' | 'verduleria'
let tabActual='planificar', saveTimer=null, expandido=null;

// SERVICE WORKER
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(e=>console.log('SW:',e));
}

window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
function updateOnlineStatus(){
  document.getElementById('offlineBanner').classList.toggle('visible',!navigator.onLine);
  setStatus(navigator.onLine?'ok':'err', navigator.onLine?'Conectado':'Sin conexión');
}

// ══ INIT ══
async function init(){
  setStatus('cargando');
  try{
    await Promise.all([cargarCatalogos(), cargarEstado(), cargarHistorial()]);
    setStatus('ok');
  }catch(e){
    setStatus('err','Sin conexión — datos locales');
    cargarLocal();
  }
  updateOnlineStatus();
  setModo('super');
  abrirDesdeLink();
  startRefresh(); // sync tachados en tiempo real
}

// El widget de Android abre ?tareas (lista de tareas) o ?nueva (alta de tarea).
// Con &pendientes viene de la vista sin fecha del widget.
function abrirDesdeLink(){
  const p=new URLSearchParams(location.search);
  if(!p.has('tareas')&&!p.has('nueva'))return;
  if(p.has('pendientes'))elegirFiltro('Pendientes');
  setModo('tareas');
  if(p.has('nueva')){abrirModalTarea();setTimeout(()=>document.getElementById('mtNombre').focus(),100);}
  history.replaceState(null,'',location.pathname); // que recargar no lo vuelva a abrir
}

// ══ MODO ══
function setModo(m){
  modo=m;
  const esT=m==='tareas';
  document.getElementById('modoTareas').className='modo-btn'+(esT?' active-tareas':'');
  document.querySelector('.tabs').style.display=esT?'none':'';
  document.getElementById('panelTareas').style.display=esT?'':'none';
  if(esT){
    const fec=document.getElementById('tNuevaFecha');
    if(!fec.value)fec.value=fechaInicial();
    document.getElementById('modoSuper').className='modo-btn';
    document.getElementById('modoVerde').className='modo-btn';
    ['Planificar','Comprar','Historial','Stats'].forEach(n=>{const p=document.getElementById('panel'+n);if(p)p.style.display='none';});
    renderTareas();
    return;
  }
  setTab(tabActual==='stats'&&m==='verduleria'?'planificar':tabActual);
  busqueda=''; filtroActivo='todos';
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('visible');

  // Botones modo
  document.getElementById('modoSuper').className='modo-btn'+(m==='super'?' active-super':'');
  document.getElementById('modoVerde').className='modo-btn'+(m==='verduleria'?' active-verde':'');
  // Stats solo visible en super
  const tabStats=document.getElementById('tabStats');
  if(tabStats) tabStats.style.display=m==='super'?'':'none';
  if(m==='verduleria'&&tabActual==='stats') setTab('planificar');

  // Color tabs
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.remove('active','active-verde');
    if(t.id==='tab'+tabActual.charAt(0).toUpperCase()+tabActual.slice(1)){
      t.classList.add(m==='super'?'active':'active-verde');
    }
  });

  renderActionBar();
  renderFiltros();
  render();
}

function renderActionBar(){
  const bar=document.getElementById('actionBarPlan');
  if(modo==='super'){
    bar.innerHTML=`<button class="btn btn-primary" onclick="abrirModalSuper()">+ Nuevo producto</button>
                   <button class="btn btn-ghost" onclick="guardar()">💾 Guardar lista</button>`;
  } else {
    bar.innerHTML=`<button class="btn btn-primary-verde" onclick="abrirModalVerde()">+ Nuevo producto</button>
                   <button class="btn btn-ghost" onclick="guardar()">💾 Guardar lista</button>`;
  }
}

function renderFiltros(){
  const bar=document.getElementById('filtrosBar');
  if(modo==='super'){
    bar.innerHTML=`
      <button class="filtro-btn active" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filtro-btn" onclick="setFiltro('fijo',this)">⭐ Fijos</button>
      <button class="filtro-btn" onclick="setFiltro('ocasional',this)">✦ Ocasionales</button>
      <button class="filtro-btn" onclick="setFiltro('en-lista',this)">🛒 En lista</button>`;
  } else {
    bar.innerHTML=`
      <button class="filtro-btn active" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filtro-btn" onclick="setFiltro('en-lista',this)">🥦 En lista</button>`;
  }
}

// ══ CARGA ══
async function cargarCatalogos(){
  await Promise.all([cargarCatalogoSuper(), cargarCatalogoVerde()]);
}

async function cargarCatalogoSuper(){
  const res=await fetch(CSV_PRODUCTOS+'&t='+Date.now());
  const buf=await res.arrayBuffer();
  const text=new TextDecoder('utf-8').decode(buf);
  const filas=text.trim().split('\n').slice(1);
  catalogoSuper=filas.map(f=>{
    const cols=parseCsvRow(f);
    return{
      nombre:     cols[0]?.trim()||'',
      categoria:  cols[1]?.trim()||'Otro',
      qty_default:parseInt(cols[2])||1,
      foto:       cols[3]?.trim()||'',
      codigo:     cols[4]?.trim()||'',
      precio:     parseInt(cols[5])||0,
      frecuencia: 'ocasional',
      nota:       ''
    };
  }).filter(p=>p.nombre);
}

async function cargarCatalogoVerde(){
  const res=await fetch(CSV_VERDULERIA+'&t='+Date.now());
  const buf=await res.arrayBuffer();
  const text=new TextDecoder('utf-8').decode(buf);
  const filas=text.trim().split('\n').slice(1);
  catalogoVerde=filas.map(f=>{
    const cols=parseCsvRow(f);
    return{nombre:cols[0]?.trim()||'',unidad:cols[1]?.trim()||'kg',foto:cols[2]?.trim()||''};
  }).filter(p=>p.nombre);
}

function parseCsvRow(row){
  const cols=[];let cur='',inQ=false;
  for(let i=0;i<row.length;i++){const c=row[i];if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){cols.push(cur);cur='';}else{cur+=c;}}
  cols.push(cur);return cols;
}

async function cargarEstado(){
  const res=await fetch(SCRIPT_URL+'?t='+Date.now());
  const json=await res.json();
  const data=json.data||{};
  if(json.tareas)tareas=json.tareas;
  listaSuper=data.listaSuper||{};
  listaVerde=data.listaVerde||{};
  // Aplicar tachados desde hoja Tachados
  const tachados=json.tachados||[];
  tachados.forEach(t=>{
    if(t.modo==='super' && listaSuper[t.nombre]) listaSuper[t.nombre].comprado=t.comprado;
    if(t.modo==='verduleria' && listaVerde[t.nombre]) listaVerde[t.nombre].comprado=t.comprado;
  });
  if(data.catalogoExtras){
    data.catalogoExtras.forEach(ex=>{
      const prod=catalogoSuper.find(p=>p.nombre===ex.nombre);
      if(prod){
        if(!prod.precio && ex.precio) prod.precio=ex.precio;
        prod.frecuencia=ex.frecuencia||'ocasional';
        prod.nota=ex.nota||'';
      } else {
        catalogoSuper.push({...ex,foto:'',codigo:''});
      }
    });
  }
}

async function cargarHistorial(){
  try{
    const res=await fetch(CSV_HISTORIAL+'&t='+Date.now());
    const buf=await res.arrayBuffer();
    const text=new TextDecoder('utf-8').decode(buf);
    const filas=text.trim().split('\n').slice(1).filter(f=>f.trim());
    historialSuper=[];historialVerde=[];
    filas.forEach(f=>{
      // Parser especial: las primeras 5 columnas son simples, la 6ta (items) es JSON complejo
      // Encontrar las primeras 5 comas y tomar el resto como items
      let rest = f;
      const cols = [];
      for(let i=0;i<5;i++){
        // Manejar campos con comillas
        if(rest.startsWith('"')){
          const end=rest.indexOf('"',1);
          cols.push(rest.substring(1,end));
          rest=rest.substring(end+2); // skip closing quote and comma
        } else {
          const idx=rest.indexOf(',');
          if(idx===-1){cols.push(rest);rest='';}
          else{cols.push(rest.substring(0,idx));rest=rest.substring(idx+1);}
        }
      }
      // El resto es el JSON de items (puede tener comas dentro)
      let itemsRaw = rest.trim();
      // Quitar comillas externas del CSV y des-escapar comillas dobles
      if(itemsRaw.startsWith('"')&&itemsRaw.endsWith('"')){
        itemsRaw=itemsRaw.slice(1,-1).replace(/""/g,'"');
      }
      if(!cols[0])return;
      const entrada={
        id:    parseInt(cols[0])||0,
        fecha: cols[1]?.trim()||'',
        hora:  cols[2]?.trim()||'',
        modo:  cols[3]?.trim()||'super',
        total: parseFloat(cols[4])||0,
        items: []
      };
      try{ entrada.items=JSON.parse(itemsRaw); }catch(e){ console.log('Error items:',e,itemsRaw.substring(0,100)); }
      if(entrada.modo==='verduleria') historialVerde.push(entrada);
      else historialSuper.push(entrada);
    });
    historialSuper.sort((a,b)=>b.id-a.id);
    historialVerde.sort((a,b)=>b.id-a.id);
  }catch(e){ console.log('Error cargando historial:',e); }
}

function cargarLocal(){
  try{
    const r=localStorage.getItem('lista_compras');
    if(r){const d=JSON.parse(r);listaSuper=d.listaSuper||{};listaVerde=d.listaVerde||{};}
  }catch(e){}
}

// ══ HELPERS MODO ══
function getCatalogo(){ return modo==='super'?catalogoSuper:catalogoVerde; }
function getLista(){ return modo==='super'?listaSuper:listaVerde; }
function getHistorial(){ return modo==='super'?historialSuper:historialVerde; }

// ══ GUARDAR ══
function getPayload(){
  // Solo guardamos lista activa y extras del catálogo — historial va en hoja separada
  const catalogoExtras=catalogoSuper.map(p=>({nombre:p.nombre,categoria:p.categoria,qty_default:p.qty_default,frecuencia:p.frecuencia||'ocasional',nota:p.nota||''}));
  return{listaSuper,listaVerde,catalogoExtras};
}

function guardarDebounce(){
  clearTimeout(saveTimer);
  document.getElementById('savingInd').classList.add('visible');
  saveTimer=setTimeout(guardar,1200);
}

async function guardar(){
  clearTimeout(saveTimer);
  const payload=getPayload();
  localStorage.setItem('lista_compras',JSON.stringify(payload));
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    showToast('Guardado ✓');
  }catch(e){showToast('Guardado localmente');}
  document.getElementById('savingInd').classList.remove('visible');
}

async function guardarFoto(nombre,url){
  const prod=catalogoSuper.find(p=>p.nombre===nombre)||catalogoVerde.find(p=>p.nombre===nombre);
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({accion:'foto',modo,nombre,codigo:prod?.codigo||'',url})});
  }catch(e){}
}

// ══ TOGGLE EN LISTA ══
function toggleEnLista(nombre,e){
  if(e)e.stopPropagation();
  const lista=getLista();
  if(lista[nombre]){delete lista[nombre];}
  else{
    if(modo==='super'){
      const prod=catalogoSuper.find(p=>p.nombre===nombre);
      lista[nombre]={qty:prod?.qty_default||1,comprado:false};
    } else {
      const prod=catalogoVerde.find(p=>p.nombre===nombre);
      lista[nombre]={qty:0.5,unidad:prod?.unidad||'kg',comprado:false};
    }
  }
  guardarDebounce();render();
}

// ══ CANTIDAD SUPER ══
function cambiarQty(nombre,delta,e){
  e.stopPropagation();
  const lista=getLista();
  if(!lista[nombre])return;
  lista[nombre].qty=Math.max(1,(lista[nombre].qty||1)+delta);
  guardarDebounce();render();
}

// ══ CANTIDAD VERDULERÍA ══
function cambiarQtyVerde(nombre,e){
  e.stopPropagation();
  const val=parseFloat(e.target.value);
  if(!isNaN(val)&&val>0) listaVerde[nombre].qty=val;
  guardarDebounce();
}

function cambiarUnidadVerde(nombre,e){
  e.stopPropagation();
  listaVerde[nombre].unidad=e.target.value;
  guardarDebounce();
}

// ══ TOGGLE COMPRADO ══
function toggleComprado(nombre,e){
  e.stopPropagation();
  const lista=getLista();
  if(!lista[nombre])return;
  lista[nombre].comprado=!lista[nombre].comprado;
  const comprado=lista[nombre].comprado;
  // Guardar solo el tachado en hoja Tachados — no pisamos el estado del otro
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'tachar',nombre,modo,comprado})}).catch(e=>{});
  renderComprar();actualizarBadge();
}

// ══ ELIMINAR ══
async function eliminarProducto(nombre,e){
  e.stopPropagation();
  if(!confirm(`¿Eliminar "${nombre}"?`))return;
  if(modo==='super'){catalogoSuper=catalogoSuper.filter(p=>p.nombre!==nombre);if(listaSuper[nombre])delete listaSuper[nombre];}
  else{catalogoVerde=catalogoVerde.filter(p=>p.nombre!==nombre);if(listaVerde[nombre])delete listaVerde[nombre];}
  if(expandido===nombre)expandido=null;
  guardarDebounce();render();
  const _prodEl=modo==='super'?catalogoSuper.find(p=>p.nombre===nombre):catalogoVerde.find(p=>p.nombre===nombre);
  try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({accion:'eliminar_producto',modo,nombre,codigo:_prodEl?.codigo||''})});}catch(e){}
  showToast(`"${nombre}" eliminado`);
}

// ══ DETALLE ══
function toggleDetalle(nombre,e){
  e.stopPropagation();
  expandido=expandido===nombre?null:nombre;
  renderCatalogo();
  if(expandido===nombre)setTimeout(()=>initDetalleInputs(esc(nombre)),50);
}

function initDetalleInputs(idSafe){
  const el=document.getElementById('foto_'+idSafe);
  if(el)initFotoInput(el);
}

function initFotoInput(el){
  if(el._initialized)return;
  el._initialized=true;
  const url=el.getAttribute('data-url')||'';
  el.value=url;
  const idSafe=el.id.replace('foto_','');
  const img=document.getElementById('fotoPreview_'+idSafe);
  if(img&&url){img.src=url;img.classList.remove('error');}
}

function previewFoto(idSafe){
  const url=document.getElementById('foto_'+idSafe)?.value.trim()||'';
  const img=document.getElementById('fotoPreview_'+idSafe);
  if(!img)return;
  if(url){img.src=url;img.classList.remove('error');}
  else{img.src='';img.classList.add('error');}
}

function guardarDetalle(nombre){
  const prod=catalogoSuper.find(p=>p.nombre===nombre);
  if(!prod)return;
  const nuevoPrecio=parseInt(document.getElementById(`precio_${CSS.escape(nombre)}`)?.value)||0;
  prod.frecuencia=document.getElementById(`freq_${CSS.escape(nombre)}`)?.value||'ocasional';
  prod.nota=document.getElementById(`nota_${CSS.escape(nombre)}`)?.value||'';
  const nuevaFoto=document.getElementById(`foto_${CSS.escape(nombre)}`)?.value.trim()||'';
  const fotoChanged=nuevaFoto!==(prod.foto||'');
  const precioChanged=nuevoPrecio!==prod.precio;
  prod.foto=nuevaFoto;
  prod.precio=nuevoPrecio;
  if(fotoChanged)guardarFoto(nombre,nuevaFoto);
  if(precioChanged)guardarPrecio(nombre,nuevoPrecio);
  guardarDebounce();renderCatalogo();showToast('Datos guardados');
}

async function guardarPrecio(nombre, precio){
  const prod=catalogoSuper.find(p=>p.nombre===nombre);
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({accion:'precio',nombre,codigo:prod?.codigo||'',precio})});
  }catch(e){}
}

// ══ EDITAR NOMBRE ══
function editarNombre(nombreActual,e){
  e.stopPropagation();
  const row=e.target.closest('.prod-row');
  const span=row.querySelector('.prod-nombre');
  if(!span)return;
  const input=document.createElement('input');input.className='prod-nombre-input';input.value=nombreActual;
  span.replaceWith(input);input.focus();input.select();row.onclick=null;
  const confirmar=()=>{
    const nuevo=input.value.trim();
    if(nuevo&&nuevo!==nombreActual){
      const cat=modo==='super'?catalogoSuper:catalogoVerde;
      const lista=getLista();
      const prod=cat.find(p=>p.nombre===nombreActual);
      if(prod){if(lista[nombreActual]){lista[nuevo]=lista[nombreActual];delete lista[nombreActual];}prod.nombre=nuevo;if(expandido===nombreActual)expandido=nuevo;guardarDebounce();showToast(`Renombrado a "${nuevo}"`);}
    }
    render();
  };
  input.addEventListener('blur',confirmar);
  input.addEventListener('keydown',ev=>{if(ev.key==='Enter')input.blur();if(ev.key==='Escape'){input.value=nombreActual;input.blur();}});
}

// ══ EDITAR CATEGORÍA ══
function editarCategoria(catActual,e){
  e.stopPropagation();
  const span=e.target;
  const input=document.createElement('input');input.className='cat-label-input';input.value=catActual;
  span.replaceWith(input);input.focus();input.select();
  const confirmar=()=>{
    const nueva=input.value.trim();
    if(nueva&&nueva!==catActual){catalogoSuper.forEach(p=>{if(p.categoria===catActual)p.categoria=nueva;});guardarDebounce();showToast(`Categoría → "${nueva}"`);}
    render();
  };
  input.addEventListener('blur',confirmar);
  input.addEventListener('keydown',ev=>{if(ev.key==='Enter')input.blur();if(ev.key==='Escape'){input.value=catActual;input.blur();}});
}

// ══ ARCHIVAR ══
function archivarLista(){
  const lista=getLista();
  const items=Object.entries(lista);
  if(!items.length){showToast('La lista está vacía');return;}
  if(!confirm('¿Archivar esta lista?'))return;
  const cat=getCatalogo();
  const totalEstimado=modo==='super'?items.reduce((s,[n,d])=>{const p=catalogoSuper.find(x=>x.nombre===n);return s+(p?.precio||0)*(d.qty||1);},0):0;
  const entrada={
    id:Date.now(),
    fecha:new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}),
    hora:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),
    total:totalEstimado,
    modo,
    items:items.map(([nombre,d])=>{
      const prod=cat.find(p=>p.nombre===nombre);
      return{nombre,qty:d.qty||1,unidad:d.unidad||'',precio:prod?.precio||0,categoria:prod?.categoria||'',comprado:d.comprado||false};
    })
  };
  // Guardar en hoja Historial via script
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'archivar',...entrada})}).catch(e=>{});
  // Actualizar local
  if(modo==='super'){historialSuper.unshift(entrada);listaSuper={};}
  else{historialVerde.unshift(entrada);listaVerde={};}
  guardar();render();setTab('historial');showToast('Lista archivada ✓');
}

function limpiarLista(){
  if(!confirm('¿Limpiar toda la lista?'))return;
  if(modo==='super')listaSuper={};else listaVerde={};
  // Limpiar tachados del modo en el Sheet
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'limpiar',modo})}).catch(e=>{});
  guardar();render();
}

// ══ RENDER CATÁLOGO ══
function renderCatalogo(){
  const cont=document.getElementById('catalogoContainer');
  const cat=getCatalogo();
  const lista=getLista();
  if(!cat.length){cont.innerHTML='<div class="empty"><div class="icon">📦</div><p>Cargando…</p></div>';return;}

  let filtrado=cat;
  if(busqueda)filtrado=filtrado.filter(p=>p.nombre.toLowerCase().includes(busqueda));
  if(filtroActivo==='fijo')filtrado=filtrado.filter(p=>p.frecuencia==='fijo');
  if(filtroActivo==='ocasional')filtrado=filtrado.filter(p=>p.frecuencia!=='fijo');
  if(filtroActivo==='en-lista')filtrado=filtrado.filter(p=>lista[p.nombre]);
  if(!filtrado.length){cont.innerHTML=`<div class="empty"><div class="icon">🔍</div><p>Sin resultados</p></div>`;return;}

  if(modo==='verduleria'){
    renderCatalogoVerde(filtrado,lista,cont);
  } else {
    renderCatalogoSuper(filtrado,lista,cont);
  }
}

// ══ RENDER HISTORIAL ══
function generarComparador(histActual, histAnterior){
  if(!histAnterior) return '';

  // Mapear precios de ambas compras por nombre
  const preciosAnt={}, preciosNuev={};
  histAnterior.items.forEach(i=>{ if(i.precio>0) preciosAnt[i.nombre]=i.precio; });
  histActual.items.forEach(i=>{ if(i.precio>0) preciosNuev[i.nombre]=i.precio; });

  // Solo productos que aparecen en ambas con precio
  const comunes=Object.keys(preciosNuev).filter(n=>preciosAnt[n]&&preciosNuev[n]);
  if(!comunes.length) return '';

  let suben=0, bajan=0, iguales=0;
  let totalAnt=0, totalNuev=0;
  let rows='';

  comunes.sort((a,b)=>{
    const diffA=((preciosNuev[a]-preciosAnt[a])/preciosAnt[a]);
    const diffB=((preciosNuev[b]-preciosAnt[b])/preciosAnt[b]);
    return diffB-diffA; // mayor variación primero
  });

  comunes.forEach(nombre=>{
    const ant=preciosAnt[nombre];
    const nuev=preciosNuev[nombre];
    const diff=((nuev-ant)/ant*100);
    totalAnt+=ant; totalNuev+=nuev;
    let badge='';
    if(Math.abs(diff)<0.5){ badge=`<span class="badge-igual">= igual</span>`; iguales++; }
    else if(diff>0){ badge=`<span class="badge-sube">▲ ${diff.toFixed(0)}%</span>`; suben++; }
    else{ badge=`<span class="badge-baja">▼ ${Math.abs(diff).toFixed(0)}%</span>`; bajan++; }
    rows+=`<div class="precio-comp-row">
      <span class="precio-comp-nombre">${nombre}</span>
      <div class="precio-comp-valores">
        <span class="precio-ant">$${ant.toLocaleString('es-AR')}</span>
        <span class="precio-nuevo">$${nuev.toLocaleString('es-AR')}</span>
        ${badge}
      </div>
    </div>`;
  });

  const diffTotal=totalAnt>0?((totalNuev-totalAnt)/totalAnt*100):0;
  const resumenClass=diffTotal>=0?'sube':'baja';
  const resumenIcon=diffTotal>=0?'▲':'▼';
  const resumen=`<div class="resumen-inflacion ${resumenClass}">
    <span>Variación promedio de precios</span>
    <span style="font-weight:700">${resumenIcon} ${Math.abs(diffTotal).toFixed(1)}%</span>
  </div>`;

  return `<div class="precio-comp">
    <div class="precio-comp-title">📈 Comparación vs compra anterior — ${suben} suben · ${bajan} bajan · ${iguales} iguales</div>
    ${rows}
    ${resumen}
  </div>`;
}

function renderHistorial(){
  const cont=document.getElementById('historialContainer');
  const histSuper=historialSuper||[];
  const histVerde=historialVerde||[];
  const todos=[...histSuper,...histVerde].sort((a,b)=>b.id-a.id);
  if(!todos.length){
    cont.innerHTML='<div class="empty"><div class="icon">📅</div><p>No hay listas archivadas.<br>Usá el botón <strong>Archivar</strong> en Comprar.</p></div>';
    return;
  }
  let html='';
  todos.forEach(h=>{
    const esVerde=h.modo==='verduleria';
    const totalReal=h.items.reduce((s,i)=>s+(i.precio||0)*(i.qty||1),0);
    const comprados=h.items.filter(i=>i.comprado).length;
    // Buscar compra anterior del mismo modo para comparar
    const mismaModa=todos.filter(x=>x.modo===h.modo);
    const idxActual=mismaModa.findIndex(x=>x.id===h.id);
    const anterior=mismaModa[idxActual+1]||null;
    const compHTML=generarComparador(h, anterior);

    html+=`<div class="hist-item ${esVerde?'verde':'super'}" id="hist_${h.id}">
      <div class="hist-header" onclick="toggleHistItem(${h.id})">
        <div>
          <div style="font-weight:600;font-size:.9rem">
            <span class="hist-modo-badge ${esVerde?'hist-modo-verde':'hist-modo-super'}">${esVerde?'🥦 Verdulería':'🛒 Super'}</span>
            ${h.fecha} <span style="color:var(--muted);font-size:.78rem">${h.hora}</span>
          </div>
          <div class="hist-fecha">${h.items.length} productos · ${comprados} comprados</div>
        </div>
        <div>
          ${totalReal>0?`<div class="hist-total">$${totalReal.toLocaleString('es-AR')}</div>`:''}
          <div style="color:var(--muted);font-size:.8rem;text-align:right;margin-top:.2rem">▼</div>
        </div>
      </div>
      <div class="hist-detalle">
        ${h.items.map(i=>`
          <div class="hist-prod-row">
            <span style="${i.comprado?'text-decoration:line-through;color:var(--muted)':''}">${i.nombre} ${i.unidad?i.qty+' '+i.unidad:'×'+i.qty}</span>
            <span style="color:var(--accent2)">${i.precio?'$'+(i.precio*i.qty).toLocaleString('es-AR'):''}</span>
          </div>`).join('')}
        ${compHTML}
        <div class="hist-acciones">
          <button class="btn btn-ghost" style="font-size:.8rem;padding:.35rem .7rem" onclick="restaurarDesdeHistorial(${h.id},'${h.modo}')">↩ Restaurar</button>
          <button class="btn btn-ghost" style="font-size:.8rem;padding:.35rem .7rem;color:var(--danger)" onclick="eliminarHistorial(${h.id},'${h.modo}')">🗑 Eliminar</button>
        </div>
      </div>
    </div>`;
  });
  cont.innerHTML=html;
}

function toggleHistItem(id){document.getElementById('hist_'+id)?.classList.toggle('abierto');}

function restaurarDesdeHistorial(id,m){
  const hist=m==='verduleria'?historialVerde:historialSuper;
  const entrada=hist.find(h=>h.id===id);
  if(!entrada)return;
  if(!confirm('¿Restaurar esta lista?'))return;
  if(m==='verduleria'){listaVerde={};entrada.items.forEach(i=>{listaVerde[i.nombre]={qty:i.qty,unidad:i.unidad||'kg',comprado:false};});}
  else{listaSuper={};entrada.items.forEach(i=>{listaSuper[i.nombre]={qty:i.qty,comprado:false};});}
  guardarDebounce();setModo(m);setTab('planificar');showToast('Lista restaurada ✓');
}

function eliminarHistorial(id,m){
  if(!confirm('¿Eliminar este registro?'))return;
  if(m==='verduleria')historialVerde=historialVerde.filter(h=>h.id!==id);
  else historialSuper=historialSuper.filter(h=>h.id!==id);
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'eliminar_historial',id})}).catch(e=>{});
  guardarDebounce();renderHistorial();showToast('Eliminado');
}

// ══ COPIAR LISTA ══
function copiarLista(){
  const lista=getLista();
  const cat=getCatalogo();
  const items=Object.entries(lista);
  if(!items.length){showToast('La lista está vacía');return;}

  let texto='';
  const fecha=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});

  if(modo==='super'){
    texto+=`🛒 *Lista Supermercado* — ${fecha}\n`;
    texto+='─────────────────\n';

    // Agrupar por categoría
    const cats={};
    items.forEach(([nombre,d])=>{
      const prod=cat.find(p=>p.nombre===nombre);
      const c=prod?.categoria||'Otro';
      if(!cats[c])cats[c]=[];
      cats[c].push({nombre,qty:d.qty||1,precio:prod?.precio||0,comprado:d.comprado||false});
    });
    const catsSorted=Object.keys(cats).sort((a,b)=>a.localeCompare(b,'es'));
    catsSorted.forEach(c=>{
      texto+=`\n*${c.toUpperCase()}*\n`;
      cats[c].forEach(p=>{
        const check=p.comprado?'✅':'⬜';
        const precio=p.precio?` — $${(p.precio*p.qty).toLocaleString('es-AR')}`:'';
        texto+=`${check} ${p.nombre}${p.qty>1?' ×'+p.qty:''}${precio}\n`;
      });
    });

    // Total
    const total=items.reduce((s,[n,d])=>{
      const prod=cat.find(p=>p.nombre===n);
      return s+(prod?.precio||0)*(d.qty||1);
    },0);
    if(total>0){
      texto+='─────────────────\n';
      texto+=`💰 *Total estimado: $${total.toLocaleString('es-AR')}*\n`;
    }

  } else {
    texto+=`🥦 *Lista Verdulería* — ${fecha}\n`;
    texto+='─────────────────\n';
    items.sort(([a],[b])=>a.localeCompare(b,'es')).forEach(([nombre,d])=>{
      const check=d.comprado?'✅':'⬜';
      texto+=`${check} ${nombre} — ${d.qty} ${d.unidad||'kg'}\n`;
    });
  }

  navigator.clipboard.writeText(texto)
    .then(()=>showToast('¡Copiado! Pegalo en WhatsApp 📋'))
    .catch(()=>{
      // Fallback para celulares que no soportan clipboard API
      const ta=document.createElement('textarea');
      ta.value=texto;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      try{document.execCommand('copy');showToast('¡Copiado! Pegalo en WhatsApp 📋');}
      catch(e){showToast('No se pudo copiar automáticamente');}
      document.body.removeChild(ta);
    });
}

// ══ STATS ══
function renderStats(){
  const cont=document.getElementById('statsContainer');
  const hist=historialSuper;
  if(!hist.length){
    cont.innerHTML='<div class="empty"><div class="icon">📊</div><p>Hacé al menos una compra<br>para ver las estadísticas.</p></div>';
    return;
  }

  // ── Métricas generales ──
  const totalGastado=hist.reduce((s,h)=>s+h.total,0);
  const promPorCompra=totalGastado/hist.length;
  const maxCompra=Math.max(...hist.map(h=>h.total));
  const minCompra=Math.min(...hist.map(h=>h.total));

  // ── Frecuencia de productos ──
  const freq={};
  hist.forEach(h=>h.items.forEach(i=>{
    if(!freq[i.nombre]) freq[i.nombre]={count:0,totalGasto:0};
    freq[i.nombre].count++;
    freq[i.nombre].totalGasto+=(i.precio||0)*(i.qty||1);
  }));
  const freqSorted=Object.entries(freq).sort((a,b)=>b[1].count-a[1].count).slice(0,10);
  const maxFreq=freqSorted[0]?.[1].count||1;

  // ── Gasto por categoría ──
  const porCat={};
  hist.forEach(h=>h.items.forEach(i=>{
    const cat=i.categoria||'Otro';
    if(!porCat[cat]) porCat[cat]=0;
    porCat[cat]+=(i.precio||0)*(i.qty||1);
  }));
  const catSorted=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCat=catSorted[0]?.[1]||1;

  // ── Evolución del gasto ──
  const evolucion=[...hist].reverse(); // cronológico
  const maxGasto=Math.max(...evolucion.map(h=>h.total))||1;

  // ── Productos que más subieron ──
  const variaciones=[];
  for(let i=0;i<hist.length-1;i++){
    const actual=hist[i], anterior=hist[i+1];
    actual.items.forEach(item=>{
      if(!item.precio) return;
      const ant=anterior.items.find(x=>x.nombre===item.nombre);
      if(ant&&ant.precio>0){
        const pct=(item.precio-ant.precio)/ant.precio*100;
        if(Math.abs(pct)>0.5) variaciones.push({nombre:item.nombre,pct,nuevo:item.precio,ant:ant.precio});
      }
    });
  }
  variaciones.sort((a,b)=>b.pct-a.pct);
  const suben=variaciones.filter(v=>v.pct>0).slice(0,5);
  const bajan=variaciones.filter(v=>v.pct<0).slice(0,3);

  // ── Inflación entre últimas 2 compras ──
  let inflacionHTML='';
  if(hist.length>=2){
    const actual=hist[0], anterior=hist[1];
    const comunes=actual.items.filter(i=>i.precio>0&&anterior.items.find(x=>x.nombre===i.nombre&&x.precio>0));
    if(comunes.length){
      const sumAnt=comunes.reduce((s,i)=>{const a=anterior.items.find(x=>x.nombre===i.nombre);return s+(a?.precio||0);},0);
      const sumNuev=comunes.reduce((s,i)=>s+i.precio,0);
      const pct=(sumNuev-sumAnt)/sumAnt*100;
      const cls=pct>=0?'sube':'baja';
      const icon=pct>=0?'▲':'▼';
      inflacionHTML=`<div class="stat-card" style="text-align:center;padding:1rem">
        <div style="font-size:.8rem;color:var(--muted);margin-bottom:.3rem">Variación de precios entre últimas 2 compras</div>
        <span class="inflacion-badge ${cls}">${icon} ${Math.abs(pct).toFixed(1)}% en ${comunes.length} productos comunes</span>
        <div style="font-size:.75rem;color:var(--muted);margin-top:.4rem">${anterior.fecha} → ${actual.fecha}</div>
      </div>`;
    }
  }

  let html='';

  // Métricas generales
  html+=`<div class="stats-section">
    <div class="stats-title">💰 Resumen general</div>
    ${inflacionHTML}
    <div class="stat-grid">
      <div class="stat-mini"><div class="stat-mini-val">${hist.length}</div><div class="stat-mini-label">Compras registradas</div></div>
      <div class="stat-mini"><div class="stat-mini-val">$${Math.round(promPorCompra).toLocaleString('es-AR')}</div><div class="stat-mini-label">Promedio por compra</div></div>
      <div class="stat-mini"><div class="stat-mini-val">$${maxCompra.toLocaleString('es-AR')}</div><div class="stat-mini-label">Compra más cara</div></div>
      <div class="stat-mini"><div class="stat-mini-val">$${minCompra.toLocaleString('es-AR')}</div><div class="stat-mini-label">Compra más barata</div></div>
    </div>
  </div>`;

  // Evolución del gasto
  if(evolucion.length>1){
    const svgW=300,svgH=80,pad=10;
    const pts=evolucion.map((h,i)=>{
      const x=pad+(i/(evolucion.length-1))*(svgW-pad*2);
      const y=svgH-pad-(h.total/maxGasto)*(svgH-pad*2);
      return{x,y,total:h.total,fecha:h.fecha};
    });
    const polyline=pts.map(p=>`${p.x},${p.y}`).join(' ');
    const area=`${pts[0].x},${svgH} `+pts.map(p=>`${p.x},${p.y}`).join(' ')+` ${pts[pts.length-1].x},${svgH}`;
    html+=`<div class="stats-section">
      <div class="stats-title">📈 Evolución del gasto</div>
      <div class="stat-card" style="padding:.8rem">
        <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;overflow:visible">
          <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4f8ef7" stop-opacity=".3"/><stop offset="100%" stop-color="#4f8ef7" stop-opacity="0"/></linearGradient></defs>
          <polygon points="${area}" fill="url(#grad)"/>
          <polyline points="${polyline}" fill="none" stroke="#4f8ef7" stroke-width="2" stroke-linejoin="round"/>
          ${pts.map((p,i)=>`
            <circle cx="${p.x}" cy="${p.y}" r="3" fill="#4f8ef7"/>
            <text x="${p.x}" y="${p.y-6}" text-anchor="middle" font-size="7" fill="#7a82a0">${p.fecha.substring(0,5)}</text>
            <text x="${p.x}" y="${svgH}" text-anchor="middle" font-size="7" fill="#38d9a9">$${Math.round(p.total/1000)}k</text>
          `).join('')}
        </svg>
      </div>
    </div>`;
  }

  // Productos más comprados
  html+=`<div class="stats-section">
    <div class="stats-title">🔁 Productos más comprados</div>
    <div class="stat-card">
      ${freqSorted.map(([nombre,d])=>`
        <div class="stat-bar-wrap">
          <span class="stat-bar-label" title="${nombre}">${nombre}</span>
          <div class="stat-bar-outer"><div class="stat-bar-inner" style="width:${(d.count/maxFreq*100).toFixed(0)}%;background:var(--accent)"></div></div>
          <span class="stat-bar-val">${d.count}x</span>
        </div>`).join('')}
    </div>
  </div>`;

  // Gasto por categoría
  html+=`<div class="stats-section">
    <div class="stats-title">🏷️ Gasto por categoría</div>
    <div class="stat-card">
      ${catSorted.map(([cat,total])=>`
        <div class="stat-bar-wrap">
          <span class="stat-bar-label" title="${cat}">${cat}</span>
          <div class="stat-bar-outer"><div class="stat-bar-inner" style="width:${(total/maxCat*100).toFixed(0)}%;background:var(--accent2)"></div></div>
          <span class="stat-bar-val" style="min-width:70px;color:var(--accent2)">$${Math.round(total/1000)}k</span>
        </div>`).join('')}
    </div>
  </div>`;

  // Variaciones de precio
  if(suben.length||bajan.length){
    html+=`<div class="stats-section">
      <div class="stats-title">💸 Variaciones de precio (última vs anterior)</div>
      <div class="stat-card">`;
    if(suben.length){
      html+=`<div style="font-size:.75rem;color:var(--danger);font-weight:700;margin-bottom:.3rem">▲ Subieron</div>`;
      suben.forEach(v=>{
        html+=`<div class="stat-bar-wrap">
          <span class="stat-bar-label">${v.nombre}</span>
          <div class="stat-bar-outer"><div class="stat-bar-inner" style="width:${Math.min(v.pct,100).toFixed(0)}%;background:var(--danger)"></div></div>
          <span class="stat-bar-val" style="color:var(--danger)">+${v.pct.toFixed(0)}%</span>
        </div>`;
      });
    }
    if(bajan.length){
      html+=`<div style="font-size:.75rem;color:var(--verde);font-weight:700;margin:.5rem 0 .3rem">▼ Bajaron</div>`;
      bajan.forEach(v=>{
        html+=`<div class="stat-bar-wrap">
          <span class="stat-bar-label">${v.nombre}</span>
          <div class="stat-bar-outer"><div class="stat-bar-inner" style="width:${Math.min(Math.abs(v.pct),100).toFixed(0)}%;background:var(--verde)"></div></div>
          <span class="stat-bar-val" style="color:var(--verde)">${v.pct.toFixed(0)}%</span>
        </div>`;
      });
    }
    html+=`</div></div>`;
  }

  cont.innerHTML=html;
}

let refreshTimer=null;
async function refreshTachados(){
  try{
    const res=await fetch(SCRIPT_URL+'?t='+Date.now());
    const json=await res.json();
    const tachados=json.tachados||[];
    aplicarTareasRemotas(json.tareas);

    tachados.forEach(t=>{
      if(t.modo==='super' && listaSuper[t.nombre]){
        if(listaSuper[t.nombre].comprado!==t.comprado){listaSuper[t.nombre].comprado=t.comprado;cambios=true;}
      }
      if(t.modo==='verduleria' && listaVerde[t.nombre]){
        if(listaVerde[t.nombre].comprado!==t.comprado){listaVerde[t.nombre].comprado=t.comprado;cambios=true;}
      }
    });
    if(cambios && tabActual==='comprar' && modo!=='tareas') renderComprar();
  }catch(e){}
}

function startRefresh(){ refreshTimer=setInterval(refreshTachados,10000); }
function stopRefresh(){ clearInterval(refreshTimer); }

// Solo refrescar cuando la pestaña está visible
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) stopRefresh(); else startRefresh();
});

// ══ TAREAS ══
let tareas=[], tFiltroLista='Hoy', tFiltroPersona='Todos', tOcultarComp=false, tEditId=null, tUltimoCambio=0;
let yo=''; try{yo=localStorage.getItem('yo')||'';}catch(e){}
const T_LISTAS_BASE=['Pendientes','Hogar','Pagos'];
const T_COLORES=['#4f8ef7','#38d9a9','#f59e0b','#f06b6b','#a78bfa','#4ade80','#f472b6'];

function postTarea(payload){
  tUltimoCambio=Date.now();
  return fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...payload,actor:yo})}).catch(()=>showToast('⚠️ No se pudo guardar'));
}
function setYo(n){yo=n;try{localStorage.setItem('yo',n);}catch(e){} renderTareas();}
function hoyStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function listasTareas(){
  const set=[...T_LISTAS_BASE];
  tareas.forEach(t=>{if(t.lista&&!set.includes(t.lista))set.push(t.lista);});
  return set;
}
function colorLista(l){const i=listasTareas().indexOf(l);return T_COLORES[(i<0?0:i)%T_COLORES.length];}
function fechaTxt(f){
  if(!f)return '';
  const h=hoyStr();
  const d=new Date(f+'T00:00:00'), hoy=new Date(h+'T00:00:00');
  const diff=Math.round((d-hoy)/86400000);
  if(diff<0)return `<span class="venc">📅 vencida (${f.slice(8)}/${f.slice(5,7)})</span>`;
  if(diff===0)return `<span class="hoy">📅 hoy</span>`;
  if(diff===1)return `<span>📅 mañana</span>`;
  return `<span>📅 ${f.slice(8)}/${f.slice(5,7)}</span>`;
}
const REP_TXT={diaria:'todos los días',laborables:'días hábiles',semanal:'cada semana',quincenal:'cada 2 semanas',mensual:'cada mes',anual:'cada año'};
function proxFecha(f,rep){
  let d=new Date((f||hoyStr())+'T00:00:00');
  const hoy=new Date(hoyStr()+'T00:00:00');
  const paso=()=>{
    if(rep==='diaria')d.setDate(d.getDate()+1);
    else if(rep==='laborables'){do{d.setDate(d.getDate()+1);}while(d.getDay()===0||d.getDay()===6);}
    else if(rep==='semanal')d.setDate(d.getDate()+7);
    else if(rep==='quincenal')d.setDate(d.getDate()+14);
    else if(rep==='mensual')d.setMonth(d.getMonth()+1);
    else if(rep==='anual')d.setFullYear(d.getFullYear()+1);
  };
  paso();
  while(d<=hoy)paso(); // no dejar la próxima en el pasado
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function renderTareas(){
  document.getElementById('yoAyelen').className='t-chip'+(yo==='Ayelen'?' on':'');
  document.getElementById('yoNacho').className='t-chip'+(yo==='Nacho'?' on':'');
  document.getElementById('btnToggleComp').textContent=tOcultarComp?'👁 Mostrar completadas':'👁 Ocultar completadas';
  // filtros
  const ls=['Hoy','Todas',...listasTareas()];
  document.getElementById('tFiltroListas').innerHTML=ls.map(l=>`<span class="t-chip${tFiltroLista===l?' on':''}" onclick="elegirFiltro('${esc(l)}')">${l}</span>`).join('');
  document.getElementById('tFiltroPersona').innerHTML=['Todos','Ayelen','Nacho'].map(p=>`<span class="t-chip${tFiltroPersona===p?' on':''}" onclick="tFiltroPersona='${p}';renderTareas()">👤 ${p}</span>`).join('');

  let lista=tareas.filter(t=>pasaFiltroLista(t)&&(tFiltroPersona==='Todos'||t.asignado===tFiltroPersona||t.asignado==='Todos'));
  const pend=lista.filter(t=>!t.completada).sort((a,b)=>(a.fecha||'9999')<(b.fecha||'9999')?-1:(a.fecha||'9999')>(b.fecha||'9999')?1:a.creada_ts-b.creada_ts);
  const comp=lista.filter(t=>t.completada).sort((a,b)=>b.completada_ts-a.completada_ts);

  const item=t=>{
    const asig=t.asignado?`<span>👤 ${t.asignado==='Todos'?'Los dos':t.asignado}</span>`:'';
    const rep=t.repite?`<span>🔁 ${REP_TXT[t.repite]||''}</span>`:'';
    const dn=t.completada?`<span>✔ ${t.completada_por||''}</span>`:'';
    return `<div class="t-item${t.completada?' done':''}">
      <div class="t-check" onclick="toggleTarea('${t.id}')">${t.completada?'✓':''}</div>
      <div class="t-body" onclick="abrirModalTarea('${t.id}')">
        <div class="t-titulo">${t.titulo}</div>
        ${t.descripcion?`<div class="t-desc">${t.descripcion}</div>`:''}
        <div class="t-meta"><span style="color:${colorLista(t.lista)}">● ${t.lista||'Sin lista'}</span>${asig}${t.completada?dn:fechaTxt(t.fecha)}${rep}</div>
      </div>
      <button class="t-edit" onclick="abrirModalTarea('${t.id}')">✏️</button>
    </div>`;
  };
  let html='';
  if(!pend.length&&!(comp.length&&!tOcultarComp))html=`<div class="t-vacio">🎉 No hay tareas pendientes${tFiltroLista==='Hoy'?' para hoy':''}</div>`;
  html+=pend.map(item).join('');
  if(comp.length&&!tOcultarComp)html+=`<div class="t-sec">Completadas (${comp.length})</div>`+comp.map(item).join('');
  document.getElementById('tContenedor').innerHTML=html;
}

// "Hoy": las que tienen fecha de hoy, más las pendientes vencidas (van en rojo)
function pasaFiltroLista(t){
  if(tFiltroLista==='Todas')return true;
  if(tFiltroLista==='Hoy'){const h=hoyStr();return !!t.fecha&&(t.fecha===h||(!t.completada&&t.fecha<h));}
  // "Pendientes": las que no tienen fecha (no se sabe cuándo se van a hacer), de cualquier lista
  if(tFiltroLista==='Pendientes')return !t.fecha;
  return t.lista===tFiltroLista;
}
// lista que se usa al crear una tarea según el filtro elegido
function listaPorDefecto(){return (tFiltroLista==='Todas'||tFiltroLista==='Hoy')?'Pendientes':tFiltroLista;}
// la alta rápida arranca con la fecha de hoy, salvo en "Pendientes"
function fechaInicial(){return tFiltroLista==='Pendientes'?'':hoyStr();}
function elegirFiltro(l){
  const antes=tFiltroLista;
  tFiltroLista=l;
  const fec=document.getElementById('tNuevaFecha');
  if(l==='Pendientes'||antes==='Pendientes')fec.value=fechaInicial();
  renderTareas();
}

function nuevoId(){return String(Date.now())+Math.floor(Math.random()*100);}

function agregarRapida(){
  const inp=document.getElementById('tNueva');
  const desc=document.getElementById('tNuevaDesc'), fec=document.getElementById('tNuevaFecha');
  const titulo=inp.value.trim();
  if(!titulo){if(desc.value.trim())showToast('Falta el título');inp.focus();return;}
  const fecha=fec.value;
  const t={id:nuevoId(),titulo,descripcion:desc.value.trim(),lista:listaPorDefecto(),
    asignado:tFiltroPersona==='Todos'?'Todos':tFiltroPersona,fecha,repite:'',completada:false,
    completada_por:'',completada_ts:0,creada_por:yo,creada_ts:Date.now()};
  tareas.push(t);inp.value='';desc.value='';fec.value=fechaInicial();renderTareas();
  if(!fecha&&tFiltroLista==='Hoy')showToast('📌 Guardada en Pendientes (sin fecha)');
  postTarea({accion:'tarea_guardar',tarea:t});
}

function toggleTarea(id){
  const t=tareas.find(x=>x.id===id);if(!t)return;
  if(!t.completada&&t.repite){
    // tarea repetitiva: se corre a la próxima fecha en vez de quedar completada
    t.fecha=proxFecha(t.fecha,t.repite);
    showToast('🔁 Próxima: '+t.fecha.slice(8)+'/'+t.fecha.slice(5,7));
  } else {
    t.completada=!t.completada;
    t.completada_por=t.completada?yo:'';
    t.completada_ts=t.completada?Date.now():0;
  }
  renderTareas();
  postTarea({accion:'tarea_guardar',tarea:t});
}

function toggleCompletadas(){tOcultarComp=!tOcultarComp;renderTareas();}

function borrarCompletadas(){
  const borrar=tareas.filter(t=>t.completada&&pasaFiltroLista(t));
  const n=borrar.length;
  if(!n){showToast('No hay completadas');return;}
  if(!confirm('¿Borrar '+n+' tarea(s) completada(s)?'))return;
  if(tFiltroLista==='Hoy'||tFiltroLista==='Pendientes'){
    // son filtros por fecha y no listas: se borran una por una
    tareas=tareas.filter(t=>!borrar.includes(t));
    renderTareas();
    borrar.forEach(t=>postTarea({accion:'tarea_eliminar',id:t.id}));
    return;
  }
  const l=tFiltroLista==='Todas'?'':tFiltroLista;
  tareas=tareas.filter(t=>!(t.completada&&(!l||t.lista===l)));
  renderTareas();
  postTarea({accion:'tarea_borrar_completadas',lista:l});
}

function abrirModalTarea(id){
  tEditId=id||null;
  const t=id?tareas.find(x=>x.id===id):null;
  const sel=document.getElementById('mtLista');
  sel.innerHTML=listasTareas().map(l=>`<option value="${l}">${l}</option>`).join('');
  document.getElementById('mtTitulo').textContent=t?'✏️ Editar tarea':'📝 Nueva tarea';
  document.getElementById('mtNombre').value=t?t.titulo:'';
  document.getElementById('mtDesc').value=t?t.descripcion:'';
  sel.value=t?t.lista:listaPorDefecto();
  document.getElementById('mtListaNueva').value='';
  document.getElementById('mtAsig').value=t?t.asignado:'Todos';
  document.getElementById('mtFecha').value=t?t.fecha:(tFiltroLista==='Hoy'?hoyStr():'');
  document.getElementById('mtRepite').value=t?t.repite:'';
  document.getElementById('mtBorrar').style.display=t?'':'none';
  document.getElementById('modalTarea').classList.add('open');
}
function cerrarModalTarea(){document.getElementById('modalTarea').classList.remove('open');}

function guardarTareaModal(){
  const titulo=document.getElementById('mtNombre').value.trim();
  if(!titulo){showToast('Falta el título');return;}
  const nueva=document.getElementById('mtListaNueva').value.trim();
  const lista=nueva||document.getElementById('mtLista').value||'Pendientes';
  const campos={titulo,descripcion:document.getElementById('mtDesc').value.trim(),lista,
    asignado:document.getElementById('mtAsig').value,fecha:document.getElementById('mtFecha').value,
    repite:document.getElementById('mtRepite').value};
  let t=tEditId?tareas.find(x=>x.id===tEditId):null;
  if(t)Object.assign(t,campos);
  else{t={id:nuevoId(),completada:false,completada_por:'',completada_ts:0,creada_por:yo,creada_ts:Date.now(),...campos};tareas.push(t);}
  cerrarModalTarea();renderTareas();
  postTarea({accion:'tarea_guardar',tarea:t});
}

function eliminarTarea(){
  if(!tEditId||!confirm('¿Borrar esta tarea?'))return;
  tareas=tareas.filter(x=>x.id!==tEditId);
  const id=tEditId;cerrarModalTarea();renderTareas();
  postTarea({accion:'tarea_eliminar',id});
}

// Aplica tareas del servidor (salvo que acabemos de cambiar algo local)
function aplicarTareasRemotas(arr){
  if(!arr)return;
  if(Date.now()-tUltimoCambio<8000)return;
  const antes=JSON.stringify(tareas);
  tareas=arr;
  if(modo==='tareas'&&JSON.stringify(tareas)!==antes&&!document.getElementById('modalTarea').classList.contains('open'))renderTareas();
}

init();
</script>
